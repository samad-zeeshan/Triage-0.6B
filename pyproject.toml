[project]
name = "triage"
version = "2.0.0"
description = "Support email triage with a distilled 0.6B model, calibrated confidence and a teacher cascade."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "jsonschema>=4",
  "llama-cpp-python>=0.3.8",
  "xgrammar>=0.2",
  "outlines-core>=0.2",
  "openai>=1.40",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
train = [
  "torch",
  "transformers==4.55.2",
  "trl==0.21.0",
  "peft==0.17.0",
  "accelerate==1.10.0",
  "datasets>=2.20",
]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools]
packages = ["triage", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["model: needs a GGUF file under models/"]
